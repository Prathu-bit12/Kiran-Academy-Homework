<!DOCTYPE html>
<html lang="en">

<head>
    <title>Form Building</title>
</head>

<body>
    <center>
        <h1>Welcome to Universe</h1><hr>
        <table>
        <form action="submit.html">
        
           
            <tr><td>Name : </td>
            <td><input type="text" name="" placeholder="enter name please" required><br><br></td></tr>
            
            <tr><td>Password : </td>
            <td><input type="password" name="" placeholder="enter password please"><br><br></td></tr>
            
            <tr><td>DOB : </td>
            <td><input type="date" name="" placeholder="enter your age"><br><br></td></tr>
        
            <tr><td>Mobile : </td>
            <td><input type="number" name="" placeholder="enter number please"><br><br></td></tr>
            
            <tr><td>Aadhar : </td>
            <td><input type="number" name="" placeholder="enter aadhar no please"><br><br></td></tr>
            
            <tr><td>Upload : </td>
            <td><input type="file" name="" placeholder="please upload file"><br><br></td></tr>
            
            <tr><td colspan="2" style="text-align: center;"><button type="submit">submit</button></td></tr>

        </form>
        </table>
        
          
        
        
    </center>
</body>

</html>
