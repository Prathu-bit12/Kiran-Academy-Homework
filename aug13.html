<!DOCTYPE html>
<html lang="en">
<head>
    <title>Form</title>
</head>
<body>
    <table>
     <form action="" method="get"></form>
        <tr><td>Address : </td>
        <td><textarea name="address" rows="5" cols="20">enter address</textarea><br><br></td></tr>

        <tr><td>Gender : </td>
        <td>Male :<input type="radio" name="gender" value="Male" checked>
        Female :<input type="radio" name="gender" value="Female">
        Other :<input type="radio" name="gender" value="Other"><br><br></td></tr>

        <tr><td>Skills : </td>
        <td>Full stack: <input type="checkbox" name="python" checked >
       Data Analytics: <input type="checkbox" name="da" >
       Data Science: <input type="checkbox" name="ds" ><br><br></td></tr>

       <tr><td>Country : </td>
    <td><select name="Country" id="">
        <option value="ind">India </option>
        <option value="am">America</option>
        <option value="bra">Brazil</option>
       </select></td></tr>

       <tr><td colspan="2" style="text-align: center;"><button type="Submit">Submit Please</button></td></tr>
        </form>
    </table>
</body>
</html>
